# Установка через Portainer из GitHub — ВСЕГДА latest.
# Образы: ghcr.io/finenumbers/hlr-{api,worker,web}:latest (pull_policy: always)
# Compose: ветка main репозитория https://github.com/finenumbers/hlr
#
# Portainer → Stacks → Add stack → Repository:
#   URL: https://github.com/finenumbers/hlr
#   Compose path: docker-compose.portainer.yml
#   Branch: main
#   Environment: см. infra/docker/.env.portainer.example
#
# Внешний NPM уже в Docker-сети `proxy` (создайте сеть заранее, если её нет):
#   docker network create proxy
# api и web подключены к `proxy` → в NPM: web:3000 и api:3001
# postgres / redis / worker остаются только во внутренней сети hlr_net

name: hlr

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: finenumbers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD}
      POSTGRES_DB: finenumbers
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
      - -c
      - archive_timeout=60
      - -c
      - max_wal_senders=3
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_wal_archive:/wal_archive
    networks:
      - hlr_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finenumbers -d finenumbers"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --auto-aof-rewrite-percentage
      - "100"
      - --auto-aof-rewrite-min-size
      - 64mb
      - --save
      - "60"
      - "1000"
      - --save
      - "300"
      - "100"
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hlr_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Миграции БД + создание первого админа (каждый redeploy; пароль из SEED_*).
  migrate:
    image: ghcr.io/finenumbers/hlr-api:latest
    pull_policy: always
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://finenumbers:${POSTGRES_PASSWORD}@postgres:5432/finenumbers?schema=public
      SEED_SUPERADMIN_EMAIL: ${SEED_SUPERADMIN_EMAIL:-admin@finenumbers.local}
      SEED_SUPERADMIN_PASSWORD: ${SEED_SUPERADMIN_PASSWORD:-ChangeMeNow!}
    working_dir: /app/packages/db
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        if [ -x /app/infra/scripts/migrate-and-seed.sh ]; then
          exec /app/infra/scripts/migrate-and-seed.sh
        fi
        npx --yes prisma migrate deploy
        npx --yes tsx prisma/seed.ts
    networks:
      - hlr_net

  api:
    image: ghcr.io/finenumbers/hlr-api:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://finenumbers:${POSTGRES_PASSWORD}@postgres:5432/finenumbers?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Задайте PUBLIC_API_URL}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?Задайте PUBLIC_WEB_URL}
      CORS_ORIGINS: ${PUBLIC_WEB_URL}
      API_KEY_PEPPER: ${API_KEY_PEPPER:?Задайте API_KEY_PEPPER}
      TRUST_PROXY: "true"
      METRICS_ENABLED: "true"
      SMSC_BASE_URL: https://smsc.ru
      SMSC_LOGIN: ${SMSC_LOGIN:-}
      SMSC_PASSWORD: ${SMSC_PASSWORD:-}
      SMSC_API_KEY: ${SMSC_API_KEY:-}
      SMSC_CALLBACK_SECRET: ${SMSC_CALLBACK_SECRET:-}
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - hlr_net
      - proxy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    image: ghcr.io/finenumbers/hlr-worker:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://finenumbers:${POSTGRES_PASSWORD}@postgres:5432/finenumbers?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
      WORKER_CONCURRENCY: "5"
      WORKER_METRICS_PORT: 9091
      METRICS_ENABLED: "true"
      API_KEY_PEPPER: ${API_KEY_PEPPER}
      SMSC_BASE_URL: https://smsc.ru
      SMSC_LOGIN: ${SMSC_LOGIN:-}
      SMSC_PASSWORD: ${SMSC_PASSWORD:-}
      SMSC_API_KEY: ${SMSC_API_KEY:-}
      SMSC_CALLBACK_SECRET: ${SMSC_CALLBACK_SECRET:-}
    volumes:
      - uploads_data:/data/uploads
    expose:
      - "9091"
    networks:
      - hlr_net

  web:
    image: ghcr.io/finenumbers/hlr-web:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PUBLIC_API_URL: ${PUBLIC_API_URL}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - hlr_net
      - proxy

networks:
  hlr_net:
    name: hlr_net
  # Внешний Nginx Proxy Manager (и другие прокси) живут в этой сети.
  proxy:
    external: true
    name: proxy

volumes:
  postgres_data:
  postgres_wal_archive:
  redis_data:
  uploads_data:
