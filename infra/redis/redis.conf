# Redis persistence for BullMQ + rate-limit counters.
# Ledger/billing lives in Postgres — Redis loss must not corrupt money.

appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshots as a secondary durability path
save 60 1000
save 300 100

# BullMQ must not lose keys under memory pressure
maxmemory-policy noeviction
