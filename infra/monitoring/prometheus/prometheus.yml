global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/recording-rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3001"]
    scrape_interval: 15s

  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9091"]
    scrape_interval: 15s
