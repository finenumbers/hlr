server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker Compose: scrape container JSON logs for api/worker/web.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service
    pipeline_stages:
      - docker: {}
      - match:
          selector: '{compose_service=~"api|worker"}'
          stages:
            - json:
                expressions:
                  level: level
                  msg: msg
                  message: message
                  requestId: requestId
                  tenantId: tenantId
                  jobId: jobId
                  jobItemId: jobItemId
                  service: service
            - labels:
                level:
                service:
                requestId:
                tenantId:
