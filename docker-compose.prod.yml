# Production-oriented overrides (bind data ports to localhost, enable proxy trust, uploads).
#
# Portainer / GitHub install: use docker-compose.portainer.yml (always :latest).
# See docs/DEPLOYMENT.md and infra/docker/.env.portainer.example.
#
# Local build fallback:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Optional obs:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.obs.yml up -d
#
# Backups:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile backup run --rm postgres-backup
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile backup run --rm postgres-basebackup

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}

  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  api:
    environment:
      NODE_ENV: production
      TRUST_PROXY: ${TRUST_PROXY:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?Set PUBLIC_WEB_URL}
      API_KEY_PEPPER: ${API_KEY_PEPPER:?Set API_KEY_PEPPER}
      BODY_LIMIT: ${BODY_LIMIT:-256kb}
      BODY_LIMIT_SUBMIT: ${BODY_LIMIT_SUBMIT:-1mb}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
      AUTH_LOGIN_RPM: ${AUTH_LOGIN_RPM:-20}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      SMSC_BASE_URL: ${SMSC_BASE_URL:-https://smsc.ru}
      SMSC_LOGIN: ${SMSC_LOGIN:-}
      SMSC_PASSWORD: ${SMSC_PASSWORD:-}
      SMSC_API_KEY: ${SMSC_API_KEY:-}
      SMSC_CALLBACK_SECRET: ${SMSC_CALLBACK_SECRET:-}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"

  worker:
    environment:
      NODE_ENV: production
      WORKER_METRICS_PORT: 9091
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      SMSC_BASE_URL: ${SMSC_BASE_URL:-https://smsc.ru}
      SMSC_LOGIN: ${SMSC_LOGIN:-}
      SMSC_PASSWORD: ${SMSC_PASSWORD:-}
      SMSC_API_KEY: ${SMSC_API_KEY:-}
      SMSC_CALLBACK_SECRET: ${SMSC_CALLBACK_SECRET:-}
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    expose:
      - "9091"

  web:
    environment:
      NODE_ENV: production
      PUBLIC_API_URL: ${PUBLIC_API_URL:?Set PUBLIC_API_URL}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?Set PUBLIC_WEB_URL}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  # Daily logical dump (pg_dump custom format).
  postgres-backup:
    profiles: ["backup"]
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-finenumbers}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-finenumbers}
      BACKUP_DIR: /backups/logical
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./infra/scripts:/scripts:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "/scripts/backup-postgres.sh"]

  # Weekly (or daily) physical base backup for PITR with WAL archive.
  postgres-basebackup:
    profiles: ["backup"]
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-finenumbers}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BACKUP_DIR: /backups/base
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./infra/scripts:/scripts:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "/scripts/backup-postgres-base.sh"]

volumes:
  uploads_data:
  backup_data:
