name: hlr

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finenumbers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finenumbers}
      POSTGRES_DB: ${POSTGRES_DB:-finenumbers}
    # Logical dumps + continuous WAL archive (PITR when paired with base backups).
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal_archive/%f && cp %p /wal_archive/%f
      - -c
      - archive_timeout=60
      - -c
      - max_wal_senders=3
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_wal_archive:/wal_archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finenumbers} -d ${POSTGRES_DB:-finenumbers}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/finenumbers/hlr-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: 3001
      # Host .env often uses localhost; containers must use service DNS names.
      DATABASE_URL: postgresql://${POSTGRES_USER:-finenumbers}:${POSTGRES_PASSWORD:-finenumbers}@postgres:5432/${POSTGRES_DB:-finenumbers}?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: ${UPLOAD_DIR:-/tmp/uploads}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-dev-only-api-key-pepper-change-me}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      BODY_LIMIT: ${BODY_LIMIT:-256kb}
      BODY_LIMIT_SUBMIT: ${BODY_LIMIT_SUBMIT:-1mb}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
      AUTH_LOGIN_RPM: ${AUTH_LOGIN_RPM:-20}
      AUTH_LOGOUT_RPM: ${AUTH_LOGOUT_RPM:-60}
      RATE_LIMIT_READ_MULTIPLIER: ${RATE_LIMIT_READ_MULTIPLIER:-5}
      RATE_LIMIT_READ_RPM_MAX: ${RATE_LIMIT_READ_RPM_MAX:-600}
      RATE_LIMIT_WEBHOOK_RPM: ${RATE_LIMIT_WEBHOOK_RPM:-60}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      SMSC_BASE_URL: ${SMSC_BASE_URL:-https://smsc.ru}
      SMSC_LOGIN: ${SMSC_LOGIN:-}
      SMSC_PASSWORD: ${SMSC_PASSWORD:-}
      SMSC_API_KEY: ${SMSC_API_KEY:-}
      SMSC_CALLBACK_SECRET: ${SMSC_CALLBACK_SECRET:-}
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    image: ghcr.io/finenumbers/hlr-worker:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-finenumbers}:${POSTGRES_PASSWORD:-finenumbers}@postgres:5432/${POSTGRES_DB:-finenumbers}?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: ${UPLOAD_DIR:-/tmp/uploads}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_METRICS_PORT: 9091
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      SMSC_BASE_URL: ${SMSC_BASE_URL:-https://smsc.ru}
      SMSC_LOGIN: ${SMSC_LOGIN:-}
      SMSC_PASSWORD: ${SMSC_PASSWORD:-}
      SMSC_API_KEY: ${SMSC_API_KEY:-}
      SMSC_CALLBACK_SECRET: ${SMSC_CALLBACK_SECRET:-}
    expose:
      - "9091"

  web:
    image: ghcr.io/finenumbers/hlr-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres_data:
  postgres_wal_archive:
  redis_data:
